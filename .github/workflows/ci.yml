name: ci

# Thin caller: repository checks run through `make verify`, the same command a
# reviewer runs locally, and the shared lint, secret and security workflows come
# from gamaware/.github. No job gets cloud credentials or an OIDC token; the
# workflows that reach AWS are examples for the client's CI (examples/workflows/,
# docs/adr/0008-no-cloud-access-in-repo-ci.md).

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    env:
      SHELLHARDEN_VERSION: "4.3.2"
      SHELLHARDEN_SHA256: e81e97bc6bccff59b826d3b39328ab19b26721a236440f740ba71754531c7286
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.61.0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # `make tools` fails if a scanner version drifts from the one the evidence
      # was recorded with. The Makefile runs Checkov 3.3.19 through uvx, so it
      # needs no install step here.
      - name: Install shellharden
        run: |
          set -euo pipefail
          archive="shellharden-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/anordal/shellharden/releases/download/v${SHELLHARDEN_VERSION}/${archive}"
          echo "${SHELLHARDEN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" shellharden
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: make verify
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the AWS ruleset
        run: make verify

  lint-docs:
    name: lint-docs
    uses: gamaware/.github/.github/workflows/lint-docs.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e # pinned shared workflows
    permissions:
      contents: read # checkout

  lint-actions:
    name: lint-actions
    uses: gamaware/.github/.github/workflows/lint-actions.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e # pinned shared workflows
    permissions:
      contents: read # checkout

  secrets:
    name: secrets
    uses: gamaware/.github/.github/workflows/secrets.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e # pinned shared workflows
    permissions:
      contents: read # checkout

  # Semgrep and Trivy over the whole repository; Checkov on after/ and the
  # workflows (.checkov.yaml). The intentional findings in before/ are
  # annotated or scoped to before/ one by one (nosemgrep comments,
  # .trivyignore.yaml), and make verify asserts the Checkov ones.
  security:
    name: security
    uses: gamaware/.github/.github/workflows/security.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e # pinned shared workflows
    permissions:
      contents: read # checkout

  # Builds report/REPORT.pdf in the pinned pandoc/latex image. The arguments
  # match PANDOC_ARGS in scripts/build_report.py, which builds the committed PDF.
  report:
    name: report
    uses: gamaware/.github/.github/workflows/report.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e # pinned shared workflows
    permissions:
      contents: read # checkout
    with:
      report-path: report/REPORT.md
      pandoc-args: >-
        --pdf-engine=xelatex -V geometry:margin=2.2cm -V papersize=a4 --toc --shift-heading-level-by=-1
        -V header-includes=\RecustomVerbatimEnvironment{Highlighting}{Verbatim}{commandchars=\\\{\},fontsize=\scriptsize}
