# Checkov settings shared by pre-commit and `make verify`. Findings that do not
# apply are skipped inline, next to the resource, with a reason. Nothing is
# skipped globally here. before/ is not skipped either: `make findings` scans it
# with this same file and asserts that it fails exactly the checks the report
# cites (report/evidence/before-checkov.txt).
compact: true
quiet: true
framework:
  - terraform
  - github_actions
  - secrets
skip-path:
  - .terraform
