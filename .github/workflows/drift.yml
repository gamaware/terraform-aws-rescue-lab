name: drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: envs/sandbox

jobs:
  drift:
    name: detect drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_budget_alert_emails: ${{ secrets.BUDGET_ALERT_EMAIL && format('["{0}"]', secrets.BUDGET_ALERT_EMAIL) || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scheduled runs use the main branch, which the read-only plan role trusts.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: drift-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: terraform -chdir="$WORKDIR" init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform plan
        run: |
          set +e
          terraform -chdir="$WORKDIR" plan -no-color -lock-timeout=5m -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          case "$code" in
            0) echo "### No drift in envs/sandbox" >> "$GITHUB_STEP_SUMMARY" ;;
            2)
              {
                echo "### Drift detected in envs/sandbox"
                echo '```text'
                grep -E '^\s*[#~+-]|Plan:' plan.txt || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Drift detected in envs/sandbox. Read the job summary."
              exit 1
              ;;
            *) exit "$code" ;;
          esac
