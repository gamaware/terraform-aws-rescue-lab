name: plan

on:
  pull_request:
    branches: [main]
    paths:
      - after/**
      - scripts/check-plan.sh
      - .github/workflows/plan.yml

permissions: {}

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: plan ${{ matrix.root }}
    # Pull requests from forks get no OIDC token, so only same-repository PRs plan.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [after/bootstrap, after/envs/dev, after/envs/prod]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ROOT: ${{ matrix.root }}
      TF_VAR_github_repository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read-only role: ReadOnlyAccess plus state reads and lock files. There is
      # no apply role in this repository (docs/adr/0001-read-only-diagnosis.md).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: plan-pr-${{ github.event.pull_request.number }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: terraform -chdir="$ROOT" init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir="$ROOT" plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi

      # Fails the job when the plan deletes or replaces a stateful resource,
      # including the Terraform state bucket (docs/adr/0005-plan-json-policy-gate.md).
      - name: plan gate
        id: gate
        run: |
          terraform -chdir="$ROOT" show -json tfplan > plan.json
          set +e
          scripts/check-plan.sh plan.json > gate.txt 2>&1
          code=$?
          set -e
          cat gate.txt
          exit "$code"

      - name: Comment plan on the pull request
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
          GATE: ${{ steps.gate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const root = process.env.ROOT;
            const marker = `<!-- terraform-plan:${root} -->`;
            const status = { '0': 'No changes', '1': 'Plan failed', '2': 'Changes to apply' }[process.env.EXIT_CODE];
            const gate = { success: 'passed', failure: 'BLOCKED' }[process.env.GATE] || 'not run';
            const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '');
            // Public repository: keep account IDs out of the comment.
            let plan = read('plan.txt').replace(/\b\d{12}\b/g, 'ACCOUNT_ID');
            const limit = 60000;
            if (plan.length > limit) {
              plan = '...(truncated, see the job log)\n' + plan.slice(-limit);
            }
            const body = [
              marker,
              `### terraform plan: \`${root}\` - ${status}, plan gate ${gate}`,
              '',
              '```text',
              read('gate.txt').trim() || 'plan gate did not run',
              '```',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```text',
              plan,
              '```',
              '',
              '</details>',
              '',
              `Commit ${context.payload.pull_request.head.sha.slice(0, 7)}, run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
