name: apply

on:
  push:
    branches: [main]
    paths:
      - envs/**
      - modules/**
      - .github/workflows/apply.yml
  workflow_dispatch:

permissions: {}

# Never run two applies at once, and never cancel one halfway.
concurrency:
  group: apply-sandbox
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: envs/sandbox

jobs:
  apply:
    name: terraform apply
    runs-on: ubuntu-latest
    # The environment has required reviewers, so the job waits for approval
    # before it starts. The apply role trusts only this environment.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_budget_alert_emails: ${{ secrets.BUDGET_ALERT_EMAIL && format('["{0}"]', secrets.BUDGET_ALERT_EMAIL) || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: terraform -chdir="$WORKDIR" init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION"

      - name: terraform plan
        run: terraform -chdir="$WORKDIR" plan -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: terraform -chdir="$WORKDIR" apply -lock-timeout=5m -auto-approve tfplan
